name: Android CI

on:
  push:
    branches: ['ticket/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Validate Wrapper and set up Gradle cache
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Ensure Android SDK 35
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$sdk_root"
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          packages=()
          test -f "$sdk_root/platforms/android-35/android.jar" || packages+=("platforms;android-35")
          test -x "$sdk_root/build-tools/35.0.0/aapt2" || packages+=("build-tools;35.0.0")
          if (( ${#packages[@]} )); then
            "$sdkmanager" --sdk_root="$sdk_root" "${packages[@]}"
          fi
          cat "$sdk_root/platforms/android-35/source.properties"
          cat "$sdk_root/build-tools/35.0.0/source.properties"
      - name: Gradle Wrapper version
        run: ./gradlew --version
      - name: Resolve declared build toolchain
        run: ./gradlew buildEnvironment --no-daemon --console=plain
      - name: Unit tests
        run: ./gradlew test --no-daemon --stacktrace --console=plain
      - name: Assemble Debug APK
        id: apk
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain
      - name: Upload Debug APK
        if: steps.apk.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: social-comment-collector-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Compile instrumented tests
        run: ./gradlew assembleDebugAndroidTest --no-daemon --stacktrace --console=plain
      - name: Upload test reports and Room schema
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: t0001-verification-reports
          path: |
            app/build/reports/tests/
            app/build/test-results/
            app/schemas/
          if-no-files-found: warn
          retention-days: 14
